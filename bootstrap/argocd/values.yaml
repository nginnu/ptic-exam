global:
  domain: argocd.ptic.local

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    application.resourceTrackingMethod: annotation
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 768Mi
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  initContainers:
    - name: install-ksops
      image: alpine:3.22
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          apk add --no-cache curl
          curl -sSL https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.5.1/ksops_4.5.1_Linux_x86_64.tar.gz \
            | tar -xz -C /custom-tools ksops
          chmod +x /custom-tools/ksops
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  volumeMounts:
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /.config/sops/age

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
