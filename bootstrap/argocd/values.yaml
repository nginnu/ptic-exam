global:
  domain: argocd.ptic.local

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    application.resourceTrackingMethod: annotation

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 384Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
