apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
      containers:
        - name: postgrest
          image: postgrest/postgrest:v13.0.7
          env:
            - name: PGHOST
              value: postgres-pooler.postgres.svc.cluster.local
            - name: PGDATABASE
              value: ptic
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: password
            - name: PGRST_DB_ANON_ROLE
              value: api
            - name: PGRST_DB_SCHEMAS
              value: public
            - name: PGRST_DB_PREPARED_STATEMENTS
              value: "false"
            - name: PGRST_SERVER_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
