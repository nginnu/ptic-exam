apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/rancher/local-path-provisioner
      targetRevision: v0.0.37
      path: deploy/chart/local-path-provisioner
      helm:
        valueFiles:
          - $values/platform/local-path-provisioner/values.yaml
    - repoURL: https://github.com/nginnu/ptic-exam.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
