apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-mesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nginnu/ptic-exam.git
    targetRevision: main
    path: platform/istio/mesh
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
