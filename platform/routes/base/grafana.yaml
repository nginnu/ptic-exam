apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: routes
spec:
  hostnames:
    - grafana-ptic.nginnu.com
  parentRefs:
    - name: external
      namespace: istio-system
  rules:
    - backendRefs:
        - name: grafana
          namespace: observability
          port: 80
