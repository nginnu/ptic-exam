apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: routes
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  hostnames:
    - rustfs-ptic.nginnu.com
  parentRefs:
    - name: external
      namespace: istio-system
  rules:
    - backendRefs:
        - name: rustfs
          namespace: rustfs
          port: 9001
