apiVersion: batch/v1
kind: Job
metadata:
  name: create-backup-bucket
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.32.9
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-backup
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-backup
                  key: secretKey
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - sh
            - -c
            - aws --endpoint-url http://rustfs.rustfs.svc.cluster.local:9000 s3 mb s3://postgres-backup || true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
